services:
  routing-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: routing-engine:latest
    ports:
      - "8000:8000"
    environment:
      ORS_API_KEY: ${ORS_API_KEY}
      ORS_BASE_URL: ${ORS_BASE_URL:-https://api.openrouteservice.org}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      GEOCODE_PROVIDER: ${GEOCODE_PROVIDER:-google}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-KH}
      ZONE_TIME_LIMIT_SECONDS: ${ZONE_TIME_LIMIT_SECONDS:-10.0}
      SEQUENCE_TIME_LIMIT_SECONDS: ${SEQUENCE_TIME_LIMIT_SECONDS:-5.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
