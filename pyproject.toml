[project]
name = "routing-engine"
version = "0.1.0"
description = "Geocoding and route optimisation services."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "ortools>=9.15.6755",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "annotated-doc>=0.0.5",
    "python-json-logger>=3.2.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
